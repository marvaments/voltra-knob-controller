; PlatformIO project for the Waveshare ESP32-S3-Knob-Touch-LCD-1.8
; controlling a Beyond Power Voltra over Bluetooth LE.
;
; Uses the pioarduino community fork of platform-espressif32, not the
; official PlatformIO registry one -- confirmed necessary (not just a
; fallback) by a real build: the official platform resolves an
; Arduino-ESP32 core too old to have esp32-hal-periman.h, which "GFX
; Library for Arduino"'s Arduino_ESP32SPI.h needs. pioarduino tracks a
; newer core (3.3.x on ESP-IDF 5.5.x) and is what Waveshare's own demo code
; for this board builds against. If you ever need to go back to the
; official platform for some reason, it's `platform = espressif32`.

; Without this, PlatformIO's default behavior is to build/upload EVERY
; environment below whenever one isn't explicitly picked with -e (a plain
; `pio run`, `pio run -t upload`, or VS Code's generic Build/Upload buttons
; with nothing chosen in the status bar) -- which for this project means
; also touching esp32-s3-knob-ota-a below, whose upload_port is a specific
; physical board's fixed LAN IP (192.168.1.216). That's a real network
; connection attempt to one knob's address every time, not just harmless
; extra compiling -- not something that should happen incidentally from a
; plain USB build/upload. Pinning the default to just the USB environment
; means the OTA environments are only ever touched when deliberately
; selected with an explicit -e (or picked in the VS Code status bar).
[platformio]
default_envs = esp32-s3-knob

[env:esp32-s3-knob]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
board_build.flash_size = 16MB
; Waveshare's own required Arduino IDE settings for this board (per their
; wiki manual) specify Partition Scheme "Huge App (3MB No OTA/1MB SPIFFS)".
; This project used exactly that (huge_app.csv) until OTA updates were
; added -- but "No OTA" is literal: that scheme has a single app partition
; and no ota_0/ota_1 slots, so ArduinoOTA has nowhere to write a new image
; while the running one is still active. Switched to a custom table
; (partitions_ota_16mb.csv, in the project root) sized for this board's
; real 16MB flash instead of one of the built-in OTA schemes, which all
; assume a 4MB chip and give each OTA slot only ~1.9MB -- see that file's
; own comment for the exact layout and why 3MB/slot was chosen.
board_build.partitions = partitions_ota_16mb.csv
board_upload.flash_size = 16MB
; NOTE: forcing board_upload.before_reset = no-reset here works around
; "This chip is ESP32, not ESP32-S3" when the board enumerates as
; /dev/cu.usbserial-* instead of /dev/cu.usbmodem*. This project went back
; and forth on this once already: usbmodem enumeration was briefly stable
; enough that the override got removed, but usbserial came back and the
; chip-ID error came with it. The real cost of this setting: it disables
; esptool's automatic reset-into-bootloader entirely, so *every* USB
; upload, forever, requires manually holding BOOT while powering the board
; on -- there is no separate reset button on this board, so that's the
; only way to force download mode. This does NOT affect OTA updates
; (ArduinoOTA / espota over WiFi never goes through esptool or this
; setting at all) -- only `pio run --target upload` over USB. If usbmodem
; enumeration ever becomes reliable again and manual BOOT-holding gets
; annoying, this line can be commented back out -- but expect
; "This chip is ESP32, not ESP32-S3" to return if usbserial shows up again.
board_upload.before_reset = no-reset

monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; PlatformIO's upload-port auto-detection keeps grabbing some *other* USB
; serial device on this machine instead of the actual board (previously an
; audio accessory, then an unrelated real ESP32 on a USB-serial adapter --
; hence "Wrong chip argument? This chip is ESP32, not ESP32-S3"). Pinning
; a port avoids that -- but a single hardcoded path doesn't survive
; replugging.
;
; This board's device node is NOT stable across replugs/reboots on macOS --
; not just the trailing number, but even the *prefix* macOS picks
; (usbmodem vs usbserial) can change. On this same physical board/cable
; we've seen /dev/cu.usbmodem101, /dev/cu.usbserial-10,
; /dev/cu.usbmodem1101, and /dev/cu.usbserial-110, all for the same chip
; (confirmed via `ioreg -p IOUSB -w0 -l | grep -i -B 5 "usbserial"` -- it's
; genuinely the one "USB JTAG/serial debug unit", just renamed by macOS).
; That's macOS deciding fresh at attach time which built-in serial driver
; claims the interface and what USB location ID to assign it, not
; something PlatformIO or this firmware controls.
;
; So instead of one exact path, this uses a wildcard (PlatformIO's docs
; describe upload_port as supporting glob patterns) that matches either
; prefix. None of this machine's other /dev/cu.* devices (Bluetooth,
; headphones, the debug console) start with "usb", so this only ever
; matches the board, whatever name macOS gave it this session.
;
; IMPORTANT: the pioarduino platform's own build script has a real bug
; that stops this wildcard from working on its own -- confirmed by a real
; failed upload (ERROR: Could not open /dev/cu.usb*, the port is busy or
; doesn't exist) and by reading its builder/main.py: it only runs
; PlatformIO's pattern-matching autodetect when upload_port is completely
; *unset*, so a configured wildcard just gets passed to esptool literally
; instead of being resolved. resolve_upload_port.py (extra_scripts below)
; works around that by resolving the glob itself, earlier in the build --
; see that file for the full explanation. Don't remove the extra_scripts
; line below without also either dropping this back to one exact path or
; deleting it to fall back to full auto-detection.
;
; If upload ever fails anyway, run `ls /dev/cu.*` with the board plugged
; in to double check what's actually there.
upload_port = /dev/cu.usb*
extra_scripts = pre:resolve_upload_port.py

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=1

; WiFi and ArduinoOTA (used for over-the-air firmware updates -- see
; wifi_secrets.h.example) are NOT listed here: they ship as core libraries
; bundled directly with the Arduino-ESP32 framework package itself
; (framework-arduinoespressif32/libraries/{WiFi,ArduinoOTA}), not as
; separate registry packages, so `#include <WiFi.h>` / `#include
; <ArduinoOTA.h>` just work with no lib_deps entry needed.
lib_deps =
    h2zero/NimBLE-Arduino
    moononournation/GFX Library for Arduino

; --silent works around a real bug in the esptool version (5.4.0) bundled
; by pioarduino's current "stable" release: EsptoolLogger.progress_bar()
; calls a method (_get_progress_print_file) that doesn't exist anywhere in
; its own class hierarchy, so it crashes with
;   AttributeError: 'EsptoolLogger' object has no attribute '_get_progress_print_file'
; the instant it tries to draw the flashing progress bar (right after
; compressing bootloader.bin). --silent makes esptool skip that broken
; progress-bar code path entirely via an early-return guard before the
; buggy line -- flashing itself is unaffected. If a future pioarduino
; release fixes esptool, this part is safe to remove.
;
; NOTE on the "This chip is ESP32, not ESP32-S3" upload failure: the actual
; fix for that is board_upload.before_reset above, NOT anything here. We
; tried putting `--before no-reset` directly in upload_flags first, and it
; looked reasonable (skip esptool's automatic reset, since on this board's
; native USB-Serial-JTAG connection esptool's default `--before usb-reset`
; resets the chip itself on every connection -- Espressif's esptool docs:
; "With USB-Serial/JTAG, the peripheral interprets the RTS serial control
; signal as a core reset" -- which was overriding manual BOOT-button entry).
; That reasoning was right, but the fix in the wrong place: confirmed via
; `pio run --target upload -v`, this platform's build script *always*
; appends its own hardcoded `--before default-reset --after hard-reset`
; after whatever's in upload_flags, so the real esptool command ended up
; with `--before` listed twice --
;   ...--before no-reset --chip esp32s3 ... --before default-reset --after hard-reset...
; -- and esptool takes the *last* occurrence of a repeated option, so its
; own default silently won every time. The board_upload.before_reset
; setting above works instead because it overrides the exact value
; (board.get("upload.before_reset", "default-reset")) that this platform
; script uses when it builds that hardcoded flag in the first place, so
; there's no longer a second conflicting occurrence at all.
upload_flags = --silent

; ---------------------------------------------------------------------------
; OTA (WiFi) upload environments -- one per physical knob, since each board
; gets its own IP on the LAN and PlatformIO's espota protocol needs a single
; fixed upload_port baked in at build time (no wildcard/auto-detect for it
; the way upload_port = /dev/cu.usb* works for the USB env above). Only
; usable once a given board is already running OTA-capable firmware and is
; connected to WiFi (i.e. after the one required USB flash, with
; wifi_secrets.h filled in) -- there's no listener to receive this until
; then. main.cpp gives every board a hostname derived from its own MAC
; address (voltra-knob-XXXXXX), so once a knob is on the network it's
; identifiable in the UniFi controller's client list regardless of how many
; you have.
;
; `extends` copies every other setting from the USB env above as a starting
; point (board, framework, partitions, lib_deps, build_flags, etc. all have
; to match what's already running, or the pushed image won't be
; compatible) and each of these only overrides what actually differs for a
; network upload:
;   - upload_protocol: `espota` instead of the default esptool. This makes
;     PlatformIO hand the built .bin to
;     framework-arduinoespressif32/tools/espota.py instead of esptool.
;     espota.py talks to the ArduinoOTA listener over WiFi on port 3232 by
;     default -- confirmed against both espota.py's own --port default and
;     ArduinoOTA.h's documented default port, so neither side needs any
;     port configured here.
;   - upload_port: the board's literal IPv4 address on the LAN (from the
;     UniFi controller's client list), not its "voltra-knob-XXXXXX.local"
;     mDNS name. The hostname was tried first, but espota.py resolves
;     ".local" via the OS's plain getaddrinfo(AF_UNSPEC) and just takes
;     whatever comes back first -- confirmed by reading espota.py, it has
;     no IPv4 preference -- and on this network that returned an address
;     the board's OTA UDP listener never answered on (seen as "Sending
;     invitation to voltra-knob.local ......." hanging with no response).
;     A literal IPv4 address skips that resolution step entirely. Set a
;     DHCP reservation for each board in the UniFi controller (by its MAC,
;     findable via its voltra-knob-XXXXXX name) so these addresses don't
;     drift after a reboot/lease renewal -- otherwise re-check the
;     controller's client list (or the "[main] WiFi connected (...)" USB
;     serial line) if OTA ever stops finding a board.
;   - upload_flags: --silent above is an esptool-only flag; espota.py's
;     argument parser doesn't have it (confirmed by reading espota.py --
;     it would fail with "unrecognized arguments"), so this replaces it
;     rather than adding to it. If you set kOtaPassword in wifi_secrets.h,
;     uncomment the --auth line below and match it -- otherwise leave
;     upload_flags empty. (Same wifi_secrets.h/credentials for every board
;     -- only the auto-generated hostname differs per physical unit.)
;
; Knob A -- MAC 44:bd:8d:7a:a6:9c. Once it's reflashed with the
; MAC-derived-hostname firmware, it'll show up in UniFi as
; voltra-knob-7aa69c (last 3 bytes of the MAC above). Set a DHCP
; reservation for this MAC pinning it to 192.168.1.216 so it matches
; upload_port below permanently.
[env:esp32-s3-knob-ota-a]
extends = env:esp32-s3-knob
upload_protocol = espota
upload_port = 192.168.1.216
upload_flags =
    ; --auth=your_ota_password_here

; Second knob -- not flashed with OTA-capable firmware yet, so it has no IP
; to put here. Once it's flashed once over USB (with the same
; wifi_secrets.h) and shows up in the UniFi client list as
; voltra-knob-XXXXXX, fill in its address below and this environment is
; ready to use. Uncomment when ready -- left disabled for now so an empty
; upload_port doesn't show up as a confusing half-working entry in the
; meantime.
; [env:esp32-s3-knob-ota-b]
; extends = env:esp32-s3-knob
; upload_protocol = espota
; upload_port = 192.168.1.XXX
; upload_flags =
;     ; --auth=your_ota_password_here
